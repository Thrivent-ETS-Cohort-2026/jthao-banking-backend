name: jthao-banking-backend

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: jthao-banking-backend-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jthao-banking-backend-db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: